<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Loop GPT</title>
<style>
  html,body{margin:0;height:100%;background:#06060a;color:#f4f4fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#8b7cf8,#5d4ded);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px -8px rgba(117,102,244,.65)}
  .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.15);border-top-color:#8b7cf8;border-radius:50%;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  p{color:#7d7f99;font-size:13px;margin:0}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><svg width="26" height="26" viewBox="0 0 64 64"><path fill="#fff" d="M32 12l4.6 12.2L49 28.8l-12.4 4.6L32 46l-4.6-12.6L15 28.8l12.4-4.6L32 12z"/><circle cx="45.5" cy="16.5" r="3.4" fill="#fff" opacity=".92"/></svg></div>
    <div class="spin"></div>
    <p>Loop GPT · starting</p>
  </div>
</body>
</html>
