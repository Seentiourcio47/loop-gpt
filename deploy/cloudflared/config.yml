# Loop GPT tunnel ingress — mirrors the legacy home-bridge config, plus the
# new chat.<brand> surface (LibreChat) and apex/www safety nets.
# Hostnames -> Railway public URLs (intra-cloud once private ports land).
tunnel: bc0a90c0-e120-44ba-99ea-15a6d138619b

ingress:
  # Backend API
  - hostname: api.loop-gpt.cyou
    service: https://backend-production-4d0d6.up.railway.app
    httpHostHeader: backend-production-4d0d6.up.railway.app

  # Marketing/app surface (apex + www + legacy alias)
  - hostname: loop-gpt.cyou
    service: https://frontend-production-868b.up.railway.app
    httpHostHeader: frontend-production-868b.up.railway.app
  - hostname: www.loop-gpt.cyou
    service: https://frontend-production-868b.up.railway.app
    httpHostHeader: frontend-production-868b.up.railway.app
  - hostname: app.loop-gpt.cyou
    service: https://frontend-production-868b.up.railway.app
    httpHostHeader: frontend-production-868b.up.railway.app

  # LibreChat (new chat surface)
  - hostname: chat.loop-gpt.cyou
    service: https://librechat-production-6215.up.railway.app
    httpHostHeader: librechat-production-6215.up.railway.app

  - service: http_status:404
