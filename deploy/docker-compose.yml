version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: loop-gpt-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://loopgpt:LoopGpt_Secure_2026!@db:5432/loopgpt
      - JWT_SECRET=loop-gpt-jwt-secret-CHANGE-IN-PRODUCTION
      - HF_ENDPOINT_URL=https://v29tkr3b9tnclvnb.us-east-1.aws.endpoints.huggingface.cloud
      - HF_TOKEN=<HF_TOKEN>
      - HF_MODEL=default
      - IMAGE_API_URL=https://it1i1rf992g05u29.us-east-1.aws.endpoints.huggingface.cloud
      - VIDEO_API_URL=https://s4u9zdezthdwes8o.us-east-1.aws.endpoints.huggingface.cloud
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=https://your-railway-app.railway.app
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - loop-gpt-network

  db:
    image: postgres:15-alpine
    container_name: loop-gpt-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=loopgpt
      - POSTGRES_PASSWORD=LoopGpt_Secure_2026!
      - POSTGRES_DB=loopgpt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopgpt -d loopgpt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loop-gpt-network

volumes:
  postgres-data:
  backend-uploads:

networks:
  loop-gpt-network:
    driver: bridge